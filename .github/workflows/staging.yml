name: Staging Pipeline - Sudaneel Logistics

on:
  push:
    branches: [staging, develop, 'feature/*']
  pull_request:
    branches: [main, master, staging]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual staging deployment'
        required: false
        default: 'Manual Staging Verification'

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-staging:
    name: 🧪 Staging Build & Test Validation
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://sudaneel-logistics-platform.vercel.app
    env:
      VERCEL_TOKEN: ${{ secrets['VERCEL_TOKEN'] }}
      VERCEL_ORG_ID: ${{ secrets['VERCEL_ORG_ID'] }}
      VERCEL_PROJECT_ID: ${{ secrets['VERCEL_PROJECT_ID'] }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🔍 Lint & Code Standards Check
        run: npx eslint .
        continue-on-error: true

      - name: 🏗️ Build Staging Next.js App
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_ENV: staging
          CI: false
          NEXT_TELEMETRY_DISABLED: 1

      - name: 🚀 Deploy to Staging (Vercel Preview / Preview URL)
        if: env.VERCEL_TOKEN != ''
        run: |
          npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx vercel build --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --token="$VERCEL_TOKEN"

      - name: ℹ️ Staging Pre-flight Notice
        if: env.VERCEL_TOKEN == ''
        run: |
          echo "Vercel credentials (VERCEL_TOKEN) not yet added to GitHub Secrets."
          echo "Staging pre-flight build, lint, and type checking completed successfully."

      - name: 📋 Staging Summary Report
        run: |
          echo "### 🚀 Staging Deployment Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** Staging / Preview" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Ready for QA Testing" >> $GITHUB_STEP_SUMMARY
